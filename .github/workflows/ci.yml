name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[test]'
      - name: Pytest (chain tests skip without bdnmc_jax / chain packages)
        run: python -m pytest -q

  chains-resolve:
    name: chains extra resolves (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with chains
        run: |
          python -m pip install -U pip
          pip install -e '.[test,chains]'
      - name: New writer module is importable
        run: python -c "from bdnmc_nova import hepevt; assert callable(hepevt.write)"
      - name: Pytest
        run: python -m pytest -q

  citation:
    name: citation metadata (CITATION.cff, .zenodo.json)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate CITATION.cff and check the versions agree with pyproject.toml
        run: |
          python -m pip install -q cffconvert==2.0.0 pyyaml
          cffconvert --validate
          python - <<'PY'
          import json, tomllib, yaml
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          z = json.load(open(".zenodo.json"))["version"]
          c = str(yaml.safe_load(open("CITATION.cff"))["version"])
          assert v == z == c, (v, z, c)
          print("version", v)
          PY
